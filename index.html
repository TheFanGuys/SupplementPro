<style>
:root{--bg:#f2f3f5;--sf:#fff;--ink:#101828;--mut:#667085;--ln:#e6e8ec;--ac:#0b7a66;--on:#fff;--acs:#d9f2ec;--wr:#9a4a07;--wrs:#fdf0d0;--s1:#e9a928;--s2:#e8742c;--s3:#2c9b6b;--s4:#3a78d6;--s5:#6c5cd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1318;--sf:#182028;--ink:#edf0f3;--mut:#95a0ae;--ln:#26303a;--ac:#4fcab0;--on:#062a23;--acs:#153a32;--wr:#f4a458;--wrs:#392915;--s1:#f0b840;--s2:#f08a4a;--s3:#46bd8a;--s4:#5b97ee;--s5:#8c7ee6}}
:root[data-theme="dark"]{--bg:#0e1318;--sf:#182028;--ink:#edf0f3;--mut:#95a0ae;--ln:#26303a;--ac:#4fcab0;--on:#062a23;--acs:#153a32;--wr:#f4a458;--wrs:#392915;--s1:#f0b840;--s2:#f08a4a;--s3:#46bd8a;--s4:#5b97ee;--s5:#8c7ee6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:0 16px 130px}
h1{font-size:34px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 4px 14px}
.mut{color:var(--mut);font-size:15px}
.rb{width:46px;height:46px;flex:none;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center}
.rb svg{width:22px;height:22px}
.prog{display:flex;align-items:center;gap:16px;background:var(--sf);border-radius:20px;padding:16px 18px;margin:0 0 12px}
.prog b{font-size:22px;display:block}
.bn{background:var(--wrs);color:var(--wr);border-radius:14px;padding:11px 14px;margin:8px 0;font-size:15px}
.slot{margin:22px 0 0}
.sh{display:flex;align-items:center;gap:10px;padding:0 4px 8px}
.sh h3{margin:0;font-size:19px;flex:1}
.sd{width:12px;height:12px;border-radius:50%;flex:none}
input[type=time]{font:inherit;font-size:16px;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:6px 10px}
.grp{background:var(--sf);border-radius:18px;overflow:hidden}
.it{display:flex;align-items:center;gap:14px;padding:13px 16px;min-height:62px;cursor:pointer}
.it+.it{border-top:1px solid var(--ln)}
.it>svg{width:20px;height:20px;color:var(--mut);flex:none}
.ck{width:36px;height:36px;flex:none;border-radius:50%;border:2.5px solid var(--c,var(--ac));display:grid;place-items:center;color:transparent;transition:background .15s}
.ck.on{background:var(--c,var(--ac));color:#fff}
.ck svg{width:18px;height:18px}
.tx{flex:1;min-width:0}.nm{font-weight:650}
.ds{color:var(--mut);font-size:14px}
.dn .nm{color:var(--mut);text-decoration:line-through}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.in{color:var(--ac);font-weight:700;font-size:14px}
.ad{width:38px;height:38px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}
.ad svg{width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--sf);border:1px solid var(--ln);font-size:15px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.pr{background:var(--acs);border-color:transparent;color:var(--ac)}
.chip.pr.on{background:var(--ac);color:var(--on)}
.search{width:100%;font:inherit;font-size:17px;padding:13px 16px;border-radius:14px;border:0;background:var(--sf);color:var(--ink);margin-bottom:10px;-webkit-appearance:none}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);background:color-mix(in srgb,var(--sf) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--ln);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:6px 0}
nav button.on{color:var(--ac)}
nav svg{width:26px;height:26px}
#shade{position:fixed;inset:0;background:rgba(10,15,20,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
#shade.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--sf);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;z-index:9;max-width:640px;margin:0 auto}
#sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 14px}
.sh2{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.sh2 h2{margin:0;font-size:25px;line-height:1.15}
#sheet p{margin:8px 0}
.box{background:var(--bg);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px}
.box b{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:2px}
.fld{margin-top:10px}.fld label{display:block;font-size:13px;color:var(--mut);font-weight:600}
.fld input,.fld select{width:100%;margin-top:4px;font:inherit;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--ac);color:var(--on);font-weight:700;margin-top:12px;text-align:center}
.btn.o{background:var(--bg);color:var(--ink)}.btn.dg{background:var(--wrs);color:var(--wr)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb{width:24px;height:24px;accent-color:var(--ac);flex:none}

function vToday(){const L=S.plan,dn=S.done[today()]||{},n=L.filter(p=>dn[p.k]).length,C=213.6;
const dt=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
let h=`<header class="top"><div><div class="mut">${dt}</div><h1>My Plan</h1></div><button class="rb" aria-label="Add your own" onclick="openSheet({t:'add'})">${ic('plus',2.5)}</button></header>`;
if(!L.length)return h+`<div class="prog" style="display:block"><b>Build your plan</b><div class="mut" style="margin:4px 0 8px">Start with the basics, pick a problem below, or browse the library.</div><button class="btn" onclick="starter()">Start with the basics</button><button class="btn o" onclick="go('lib')">Browse the library</button></div>`+planTiles();
h+=`<div class="prog"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--ln)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-n/L.length)}" transform="rotate(-90 42 42)"/></svg><div><b>${n} of ${L.length} taken</b><span class="mut">${n===L.length?'All done for today':(L.length-n)+' to go'}</span></div></div>`;
h+=warn().map(w=>`<div class="bn">${w}</div>`).join('');
SK.forEach(t=>{const I=L.filter(p=>p.s===t);if(!I.length)return;
h+=`<section class="slot"><div class="sh"><span class="se" style="color:${SC[t]}">${gi(SEI[t])}</span><h3>${SN[t]}</h3><input type="time" value="${tm(t)}" onchange="stm('${t}',this.value)"></div><div class="grp">${I.map(p=>row(p,dn)).join('')}</div></section>`});
return h+planTiles()}

function vLib(){return `<header class="top"><div><h1>Library</h1><div class="mut" id="cnt"></div></div></header><input class="search" id="q" type="search" placeholder="Search supplements or problems" value="${esc(Q)}" oninput="Q=this.value;fillLib()"><div class="chips" id="lc"></div><div class="chips" id="lp"></div><div id="ll"></div>`}
function fillChips(){const C=['All','Picks for 50+','Scales with weight',...new Set(D.map(d=>d.c))];
$('lc').innerHTML=C.map(c=>`<button class="chip ${(c==='Picks for 50+'?pick:c==='Scales with weight'?sw:cat===c&&!pick&&!sw&&!pb)?'on':''}" onclick="setCat('${c}')">${gi(CD[c],CC[c])}${c}</button>`).join('');
$('lp').innerHTML=PK.map((p,i)=>`<button class="chip pr ${pb===p?'on':''}" onclick="setProb(${i})">${gi(PI[p])}${p}</button>`).join('')}
function setCat(c){pb='';pick=c==='Picks for 50+';sw=c==='Scales with weight';cat=pick||sw?'All':c;fillChips();fillLib()}
function setProb(i){const p=PK[i];pb=pb===p?'':p;if(pb){cat='';pick=false;sw=false}else cat='All';fillChips();fillLib()}
function fillLib(){const q=Q.toLowerCase();
const L=D.filter(d=>(pb?P[pb].s.has(d.i):(cat==='All'||d.c===cat))&&(!pick||d.g.includes('5'))&&(!sw||W[d.n])&&(d.n+' '+d.f+' '+d.o+' '+d.c).toLowerCase().includes(q));
if($('cnt'))$('cnt').textContent=L.length+' of '+D.length+' supplements';
$('ll').innerHTML=(pb?`<div class="bn">${P[pb].n}</div>`:'')+(L.length?`<div class="grp">${L.map(d=>`<div class="it" onclick="openSup(${d.i})">${ico(d)}<div class="tx"><div class="nm">${d.n}</div><div class="ds">${SL[d.t]}</div></div>${inPlan(d.i)?'<span class="in">In my plan</span>':`<button class="ad" aria-label="Add to my plan" onclick="event.stopPropagation();quick(${d.i})">${ic('plus',2.5)}</button>`}</div>`).join('')}</div>`:'<p class="mut">No match.</p>')}

const ABOUT=`Brand picks are common third-party-tested options from general knowledge, and formulas change. Look for USP, NSF, Informed Sport or ConsumerLab seals and check the bottle. Weight-based doses are typical research ranges, not a prescription. Other supplements use fixed doses that don't change with weight. Check with your doctor before adding anything, especially if you start taking medications.`;
function vSet(){return `<header class="top"><div><h1>Settings</h1></div></header>
<div class="sh"><h3>Body weight</h3></div><div class="grp"><div class="it" style="display:block;cursor:default"><div style="display:flex;justify-content:space-between;align-items:baseline"><b id="wv" style="font-size:28px">${S.wt} lb</b><span class="mut" id="wk">${R(S.wt/2.2046)} kg</span></div><input type="range" id="wr" min="100" max="350" step="5" value="${S.wt}" oninput="setW(this.value)" style="width:100%;accent-color:var(--ac);margin-top:10px"><div class="mut" style="margin-top:6px">Changes the doses shown for the 7 supplements that scale with weight.</div></div></div>
<div class="sh" style="margin-top:22px"><h3>Daily times</h3></div><div class="grp">${SK.map(t=>`<div class="it" style="cursor:default"><span class="se" style="color:${SC[t]}">${gi(SEI[t])}</span><div class="tx nm">${SN[t]}</div><input type="time" value="${tm(t)}" onchange="stm('${t}',this.value)"></div>`).join('')}</div>
<div class="sh" style="margin-top:22px"><h3>Look</h3></div><div class="grp"><div class="sw">${Object.keys(TH).map(k=>`<button class="swb ${(S.th||'Ocean')===k?'on':''}" onclick="setTh('${k}')"><i style="background:${TH[k][0]}"></i>${k}</button>`).join('')}</div><div class="it" style="cursor:default"><div class="tx nm">Appearance</div><select class="sel" onchange="S.mode=this.value;save();applyTheme()">${[['auto','Match phone'],['light','Light'],['dark','Dark']].map(([v,l])=>`<option value="${v}" ${(S.mode||'auto')===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="it" style="cursor:default"><div class="tx nm">Open app on</div><select class="sel" onchange="S.home=this.value;save()">${[['lib','Library'],['today','My Plan']].map(([v,l])=>`<option value="${v}" ${(S.home||'lib')===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
<div class="sh" style="margin-top:22px"><h3>Plan tools</h3></div><button class="btn" onclick="cp()">Copy plan for reminders</button><textarea id="out" hidden readonly></textarea><button class="btn dg" onclick="rs(event)">Clear my plan</button>
<p class="mut" style="font-size:13px;margin-top:22px">${ABOUT}</p>`}

/* ---------- sheets ---------- */
function openSheet(o){SH=o;showSheet();$('sheet').scrollTop=0;$('shade').classList.add('on');$('sheet').classList.add('on')}
function closeSheet(){if(SH&&SH.from){SH=SH.from;showSheet();return}SH=null;$('shade').classList.remove('on');$('sheet').classList.remove('on');tab==='lib'?fillLib():render()}
function showSheet(){const b={sup:()=>shSup(SH.i),item:()=>shItem(SH.k),plan:shPlan,add:shAdd}[SH.t]();$('sheet').innerHTML='<div class="grab"></div>'+b+'<button class="btn o" onclick="closeSheet()">'+(SH.from?'Back':'Close')+'</button>'}
function openSup(i,from){openSheet({t:'sup',i,from:from||null})}
function openItem(k){const p=gp(k);p.i>=0?openSup(p.i):openSheet({t:'item',k})}
function edit(p){return `<div class="box"><div class="fld"><label>Time of day</label><select onchange="mv('${p.k}',this.value)">${opt(p.s)}</select></div><div class="fld"><label>Dose, brand, notes</label><input value="${esc(p.d)}" placeholder="${esc(sug(p.n)||'e.g. 400 mg, Thorne')}" onchange="sd('${p.k}',this.value)"></div><div class="row2"><button class="btn o" onclick="dup('${p.k}')">Split to another time</button><button class="btn dg" onclick="rm('${p.k}')">Remove</button></div></div>`}
function shSup(i){const d=D[i],ps=S.plan.filter(p=>p.i===i),by=X[d.n]||CB[d.c];
return `<div class="sh2">${ico(d,'lg')}<div><h2>${d.n}</h2><div class="mut">${d.c}. Best: ${SL[d.t].toLowerCase()}.</div></div></div><p>${INFO[d.n]||''}</p><div class="box"><b>Forms</b>${d.f}</div><div class="box"><b>Dose and timing</b>${d.o}${W[d.n]?`<br><br>At ${S.wt} lb: ${dz(d.n)}`:''}</div>`+(by?`<div class="box"><b>Good picks</b>${by[0]}</div><div class="box"><b>Avoid</b>${by[1]}</div>`:'')+(ps.length?ps.map(edit).join(''):`<button class="btn" onclick="quick(${i})">Add to my plan</button>`)+`<p class="mut" style="font-size:13px">General info, not medical advice.</p>`}
function shItem(k){const p=gp(k);return p?`<div class="sh2"><h2>${esc(p.n)}</h2></div>`+edit(p):''}
function openPlanSheet(i){pv=PK[i];PS=new Set([...P[pv].s].filter(x=>!SHORT.includes(D[x].n)&&!inPlan(x)).slice(0,6));openSheet({t:'plan'})}
function shPlan(){const L=[...P[pv].s],act=S.plan.some(x=>x.pl===pv);
return `<div class="sh2">${pic(pv,'lg')}<div><h2>${pv}</h2><div class="mut">${L.length} supplements</div></div></div><div class="bn">${P[pv].n}</div><div class="grp">${L.map(i=>`<div class="it"><input type="checkbox" class="cb" ${PS.has(i)?'checked':''} ${inPlan(i)?'disabled':''} onchange="pt(${i})">${ico(D[i],'sm')}<div class="tx" onclick="openSup(${i},SH)"><div class="nm lk">${D[i].n}</div><div class="ds">${inPlan(i)?'Already in your plan':SN[ds(i)]+(SHORT.includes(D[i].n)?', short-term only':'')}</div></div>${ic('chev')}</div>`).join('')}</div><button class="btn" onclick="addPlan()">Add checked to my plan</button>`+(act?`<button class="btn dg" onclick="rmPlan()">Remove this problem plan</button>`:'')}
function shAdd(){return `<div class="sh2"><h2>Add your own</h2></div><div class="fld"><label>Name</label><input id="cn" placeholder="e.g. Magnesium glycinate"></div><div class="fld"><label>Dose</label><input id="cd" placeholder="e.g. 400 mg"></div><div class="fld"><label>Time of day</label><select id="cs">${opt('b')}</select></div><button class="btn" onclick="addc()">Add to my plan</button>`}

/* ---------- actions ---------- */
function quick(i){if(!inPlan(i))S.plan.push({k:uid(),i,n:D[i].n,s:ds(i),d:''});save();refresh()}
function chk(k){const t=today();S.done[t]=S.done[t]||{};if(S.done[t][k])delete S.done[t][k];else S.done[t][k]=1;save();render()}
function mv(k,t){gp(k).s=t;save();refresh()}
function sd(k,v){gp(k).d=v;save();if(tab==='today')render()}
function stm(t,v){S.times[t]=v;save()}
function rm(k){S.plan=S.plan.filter(p=>p.k!==k);save();if(SH&&SH.t==='item')closeSheet();else refresh()}
function dup(k){const p=gp(k);S.plan.push({...p,k:uid(),s:SK[(SK.indexOf(p.s)+1)%SK.length]});save();refresh()}
function addc(){const n=$('cn').value.trim();if(!n)return;const m=D.findIndex(d=>d.n.toLowerCase()===n.toLowerCase());S.plan.push({k:uid(),i:m,n:m>=0?D[m].n:n,s:$('cs').value,d:$('cd').value.trim()});save();closeSheet()}
function starter(){START.forEach(n=>{const i=D.findIndex(d=>d.n===n);if(i>=0&&!inPlan(i))S.plan.push({k:uid(),i,n,s:ds(i),d:''})});save();render()}
function pt(i){PS.has(i)?PS.delete(i):PS.add(i)}
function addPlan(){[...PS].forEach(i=>{if(!inPlan(i))S.plan.push({k:uid(),i,n:D[i].n,s:ds(i),d:'',pl:pv})});save();closeSheet()}
function rmPlan(){S.plan=S.plan.filter(x=>x.pl!==pv);save();closeSheet()}
function setW(v){S.wt=+v;save();$('wv').textContent=v+' lb';$('wk').textContent=R(v/2.2046)+' kg'}
function rs(e){if(!cf){cf=1;e.target.textContent='Tap again to clear';return}cf=0;S.plan=[];save();render()}
function cp(){const t='MY SUPPLEMENT PLAN\n'+SK.map(k=>{const L=S.plan.filter(p=>p.s===k);return L.length?SN[k]+' ('+tm(k)+'): '+L.map(p=>p.n+(p.d?' '+p.d:'')+(p.pl?' [for '+p.pl+']':'')).join(', '):''}).filter(Boolean).join('\n'),o=$('out');o.hidden=false;o.value=t;o.select();try{navigator.clipboard.writeText(t)}catch(e){}}
applyTheme();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
render();
</script></body></html>
