<style>
:root{--bg:#f4f5f7;--sf:#fff;--ink:#0f172a;--mut:#5b6678;--ln:#e3e7ed;--ac:#1769e0;--acs:#e4eeff;--on:#fff;--ok:#157f43;--oks:#dcf3e5;--wn:#9a5b00;--wns:#fdf0d0;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1218;--sf:#161d26;--ink:#eef2f6;--mut:#9aa6b6;--ln:#26303c;--ok:#4bd187;--oks:#12301f;--wn:#f5b04c;--wns:#37290f;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#0d1218;--sf:#161d26;--ink:#eef2f6;--mut:#9aa6b6;--ln:#26303c;--ok:#4bd187;--oks:#12301f;--wn:#f5b04c;--wns:#37290f;--er:#ff8a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,#sheet:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:0 16px 150px}
h1{font-size:32px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:24px;line-height:1.2;margin:0}
h3{font-size:15px;margin:0;color:var(--mut);font-weight:700}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:20px 4px 14px}
.hb{display:flex;gap:8px}
.mut{color:var(--mut);font-size:15px}
.rb{width:46px;height:46px;flex:none;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center}
.rb.ghost{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
.rb svg{width:22px;height:22px}
#err{background:var(--er);color:#fff;padding:12px 16px;font-size:15px;text-align:center;margin:0 -0px}
.next{background:var(--ac);color:var(--on);border-radius:20px;padding:16px 18px;margin:0 0 12px}
.next .mut{color:inherit;opacity:.85}.next .nt{font-size:22px;font-weight:800;margin:2px 0}
.next .btn{background:var(--on);color:var(--ac);margin-top:12px}
.pg{margin:0 4px 14px}.pg .bar{display:flex;height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%}.bar .ok{background:var(--ok)}.bar .wn{background:var(--wn)}
.bn{background:var(--wns);color:var(--wn);border-radius:14px;padding:11px 14px;margin:8px 0;font-size:15px}
.slot{margin:14px 0 0}
.gh{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;min-height:48px}
.gh .gi{width:34px;height:34px;border-radius:11px;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}
.gh .gi svg{width:20px;height:20px}
.gh .gt{flex:1}.gh .gt b{font-size:18px;display:block}
.gh>svg{width:20px;height:20px;color:var(--mut);transition:transform .15s}
.gh[aria-expanded=true]>svg{transform:rotate(90deg)}
.grp{background:var(--sf);border-radius:18px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:64px}
.it+.it{border-top:1px solid var(--ln)}
.it>svg{width:20px;height:20px;color:var(--mut);flex:none}
.ck{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;color:transparent;position:relative}
.ck::before{content:"";position:absolute;inset:5px;border-radius:50%;border:2.5px solid var(--ac)}
.ck.on::before{background:var(--ok);border-color:var(--ok)}.ck.on{color:#fff}
.ck svg{width:18px;height:18px;position:relative}
.tx{flex:1;min-width:0;display:block;padding:4px 0}
.tx .nm{display:block;font-weight:650}.tx .ds{display:block;color:var(--mut);font-size:14px}
.s{display:block;font-size:13px;font-weight:650;margin-top:1px}.s.ok{color:var(--ok)}.s.wn{color:var(--wn)}.s.ac{color:var(--ac)}.s.un{color:var(--mut)}
.dn .nm{color:var(--mut)}
.mo{width:44px;height:44px;flex:none;display:grid;place-items:center;color:var(--mut);border-radius:50%}
.mo svg{width:22px;height:22px}
.ic{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--acs);color:var(--ac)}
.ic svg{width:58%;height:58%}.ic.sm{width:36px;height:36px;border-radius:12px}.ic.lg{width:54px;height:54px;border-radius:16px}
.ci{width:16px;height:16px;flex:none}.chip .ci{margin-right:6px}
.chip{display:inline-flex;align-items:center;flex:none;padding:9px 14px;border-radius:999px;background:var(--sf);border:1px solid var(--ln);font-size:15px;font-weight:600;min-height:40px}
.chip[aria-pressed=true],.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.search,.sel,.inp{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);-webkit-appearance:none;appearance:none;min-height:48px}
.sel{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.add{width:44px;height:44px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}.add svg{width:20px;height:20px}
.in{color:var(--ok);font-weight:700;font-size:14px;flex:none}
.sec{margin:22px 0 8px 4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:16px;padding:10px 12px;min-height:56px;font-weight:650;font-size:15px;line-height:1.2}
details.pl{background:var(--sf);border-radius:18px;padding:4px 14px 14px;margin:12px 0}
details.pl>summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}

Magnesium L-threonate|Magnesium bound to a threonic acid metabolite. Raised brain magnesium more than other forms in animal studies.
Magnesium malate|Magnesium bound to malic acid, which your cells use to make energy.
Magnesium taurate|Magnesium bound to taurine. Both support heart rhythm and blood vessel relaxation.
Magnesium oxide|Magnesium with oxygen. Cheap, but little is absorbed. Its main effect is drawing water into the bowel.
Magnesium topical|Magnesium chloride or sulfate on the skin. Whether it raises blood magnesium is unproven.
Calcium|Bone mineral also needed for muscle and nerve signals. Excess from pills may stress arteries and kidneys; food is the best source.
Zinc|Mineral your immune system, testosterone production, and wound healing depend on.
Copper|Trace mineral for iron use, nerves, and connective tissue. Zinc competes with it.
Iron|Carries oxygen in blood. Men rarely run low, and extra iron builds up in the body.
Selenium|Trace mineral that powers antioxidant enzymes and thyroid hormone conversion.
Iodine|Raw material for thyroid hormones, which set your metabolic rate.
Potassium|Electrolyte that balances sodium and keeps blood pressure, nerves, and muscle contractions steady.
Chromium|Trace mineral that may help insulin work better. Evidence in healthy people is weak.
Boron|Trace mineral that influences how your body uses vitamin D, magnesium, and sex hormones.
Vitamin D3|Hormone-like vitamin your skin makes from sun. Guides calcium use, bones, muscles, and immunity.
Vitamin K2|Directs calcium into bones and away from artery walls by activating certain proteins.
Vitamin A|Fat-soluble vitamin for vision, skin, and immune cells.
Vitamin C|Water-soluble antioxidant needed to build collagen and absorb iron.
Vitamin E|Fat-soluble antioxidant that protects cell membranes from damage.
Vitamin B12|Needed for nerves and red blood cells. Stomach acid drops with age, so absorption falls.
Folate|B vitamin for making DNA and red blood cells. Methylfolate skips a conversion step.
Vitamin B6|Helps make neurotransmitters and process protein. Too much causes nerve damage.
B-complex|All eight B vitamins together. They help turn food into energy.
Benfotiamine (B1)|Fat-soluble thiamine that reaches tissues better. Supports nerves and sugar metabolism.
Niacin (B3)|Precursor to NAD+, used in energy production. Nicotinic acid also lowers cholesterol.
NR / NMN|Precursors your cells convert into NAD+, a molecule used in energy and repair. NAD+ falls with age.
Biotin|B vitamin for hair, nails, and fat metabolism. It can distort thyroid and heart lab tests.
Choline|Raw material for acetylcholine (memory, muscle control) and cell membranes.
Inositol|Sugar-like molecule involved in insulin and serotonin signaling.
Multivitamin|Insurance-level doses of many vitamins and minerals in one pill.
Ashwagandha|Adaptogen root that lowered cortisol and stress in human trials.
Rhodiola|Adaptogen root thought to modulate stress hormones and fatigue.
Panax ginseng|Root with ginsenosides that may improve energy, focus, and blood sugar control.
Tongkat ali|Southeast Asian root that may lower cortisol and nudge free testosterone up.
Maca|Peruvian root vegetable. Mild effects on libido and mood; doesn't change hormones.
Shilajit|Mineral-rich tar from mountains. Fulvic acid is thought to be the active part.
Lion's mane|Mushroom that may raise nerve growth factor. Human evidence is early.
Reishi|Mushroom with triterpenes and beta-glucans that calm and support immunity.
Cordyceps|Mushroom studied for stamina; it may help cells use oxygen more efficiently.
Turmeric / curcumin|Curcumin blocks inflammation pathways. It absorbs poorly without fat or special forms.
Boswellia|Tree resin whose AKBA compound blocks an inflammation enzyme (5-LOX).
Saw palmetto|Berry extract that may slow conversion of testosterone to DHT in the prostate.
Nettle root|Plant root that may ease urine flow in an enlarged prostate by blocking prostate growth signals.
Milk thistle|Seed extract (silymarin) that acts as an antioxidant in liver cells.
Berberine|Plant alkaloid that activates AMPK, which lowers blood sugar and helps cells use glucose.
Ginkgo|Leaf extract that may improve blood flow and has antioxidant effects.
Bacopa|Herb that may improve memory by supporting nerve signaling. Builds over weeks.
Valerian|Root that raises GABA activity, a calming brain signal.
Passionflower|Herb that raises GABA activity, easing anxiety.
Holy basil|Adaptogenic herb (tulsi) that may blunt cortisol.
Lemon balm|Mint-family herb that raises GABA, calming nerves.
Kava|Pacific root whose kavalactones relax muscles and anxiety. Linked to liver injury in rare cases.
Ginger|Root with gingerols that calm nausea and reduce inflammation.
Ceylon cinnamon|Bark that may improve insulin sensitivity. Common cassia cinnamon has more coumarin, which stresses the liver.
Aged garlic|Aged extract with S-allylcysteine that supports blood vessel flexibility and pressure.
Green tea extract|Concentrated EGCG, an antioxidant that mildly raises fat burning. Usually has caffeine.
Fenugreek|Seed with fiber and saponins that slow sugar absorption. May nudge testosterone.
Elderberry|Berry rich in anthocyanins that may shorten cold duration.
Quercetin|Plant flavonoid that stabilizes allergy cells and acts as an antioxidant.
L-theanine|Tea amino acid that promotes alpha brain waves for calm focus.
Glycine|Simple amino acid that lowers core body temperature and calms brain signaling at bedtime.
Taurine|Amino acid that supports heart muscle, nerve calming, and cell hydration.
L-tyrosine|Raw material for dopamine and norepinephrine, which fall under stress.
5-HTP|Intermediate your body converts to serotonin. Dangerous with antidepressants.
GABA|Calming neurotransmitter. Little crosses from the bloodstream into the brain.
Creatine|Stores quick energy (phosphocreatine) in muscle and brain. The best-studied sports supplement.
L-citrulline|Converted to arginine, which makes nitric oxide and widens blood vessels.
Beta-alanine|Builds carnosine, which buffers acid in muscle during hard sets.
EAAs / BCAAs|Building blocks of muscle protein. EAAs include all nine essentials; BCAAs only three.
Whey protein|Fast-digesting milk protein high in leucine, which triggers muscle building.
Collagen|Protein rich in glycine and proline. Studied for joint and skin support.
NAC|Supplies cysteine to make glutathione, your main internal antioxidant. Also thins mucus.
Glutamine|Amino acid that fuels gut lining and immune cells.
Carnitine|Shuttles fatty acids into mitochondria to be burned for energy.
TMG (betaine)|Donates methyl groups, which lowers homocysteine.
Fish oil|EPA and DHA omega-3s that lower triglycerides and calm inflammation.
Krill oil|Omega-3s bound to phospholipids, plus astaxanthin. Less EPA/DHA per capsule.
Algae omega-3|DHA and EPA from algae, the original source fish get theirs from.
CoQ10|Mitochondrial energy molecule and antioxidant. Levels fall with age and with statins.
PQQ|Compound that may spark growth of new mitochondria.
Phosphatidylserine|Membrane fat concentrated in the brain. Supports nerve signaling.
Astaxanthin|Red algae pigment, a strong antioxidant that sits in cell membranes.
Probiotic|Live bacteria or yeast that crowd out bad microbes and signal your immune system.
Prebiotic fiber|Fibers that feed good gut bacteria so they make butyrate.
Psyllium husk|Soluble fiber that forms a gel, slowing digestion and lowering cholesterol.
Digestive enzymes|Enzymes (protease, lipase, amylase) that help break down food.
Betaine HCl|Supplemental stomach acid for people with low acid. Not for ulcers.
Butyrate|Short-chain fat that feeds colon cells and supports the gut lining.
Melatonin|Hormone that signals night to your brain. Shifts sleep timing more than it forces sleep.
Apigenin|Chamomile flavonoid that binds calming GABA receptors.
Tart cherry|Cherries rich in anthocyanins and some melatonin. Studied for soreness and sleep.
Glucosamine|Building block of cartilage. Benefit for knee pain is modest.
Chondroitin|Cartilage component that may slow cartilage loss.
MSM|Sulfur compound used to build connective tissue. May ease joint soreness.
Hyaluronic acid|Gel-like molecule that lubricates joints and holds skin moisture.
Alpha-lipoic acid|Antioxidant that works in water and fat and helps cells use glucose.
Resveratrol|Grape compound that activates longevity genes in lab studies. Human benefits are unproven.
Spermidine|Compound that triggers autophagy, the cell cleanup process.
Urolithin A|Gut-made metabolite that triggers mitophagy, clearing worn-out mitochondria.
Lutein + zeaxanthin|Pigments that collect in the macula of the eye and filter blue light.
Lycopene|Red tomato pigment, an antioxidant that concentrates in the prostate.
Sulforaphane|Broccoli compound that switches on the body's own antioxidant and detox genes (Nrf2).
Beetroot nitrate|Dietary nitrate that turns into nitric oxide, widening blood vessels.
Electrolytes|Sodium, potassium, and magnesium salts lost in sweat. They keep nerves and muscles firing.
Caffeine|Blocks adenosine, the brain's sleepiness signal. Half-life is about 5-6 hours.
Zinc carnosine|Zinc linked to carnosine that clings to the stomach lining and helps repair it.
Mastic gum|Tree resin that coats the stomach and is antibacterial in lab tests.
DGL licorice|Licorice with glycyrrhizin removed. Boosts the stomach's protective mucus.
Black seed oil|Nigella sativa oil with thymoquinone, an anti-inflammatory compound.
Oregano oil|Concentrated carvacrol, an antimicrobial in the lab. Irritating; short-term only.
Wormwood|Bitter herb with artemisinin-like compounds. Thujone makes long-term use unsafe.
Black walnut hull|Hull extract rich in juglone and tannins. Traditional antiparasitic use, unproven.
Chlorella|Green algae with a cell wall that can bind metals in the gut. Human proof is limited.
Modified citrus pectin|Broken-down fiber that may bind metals in the gut and blood.
Glutathione|Your body's master antioxidant. Oral forms may not raise levels much.
Riboflavin (B2)|B vitamin for mitochondrial energy. High doses reduced migraine frequency in studies.
Feverfew|Herb with parthenolide that may reduce migraine frequency.
Peppermint oil|Menthol relaxes gut muscle and cools skin nerves.
Arnica|Plant used on skin for bruises and soreness. Don't swallow it.
Bromelain|Pineapple enzyme that breaks down protein and may calm swelling.
Pumpkin seed oil|Seed oil with plant sterols that may help urine flow and bladder symptoms.`.split('\n').forEach(r=>{const[n,t]=r.split('|');INFO[n]=t});

SK.forEach(s=>{const I=G[s];if(!I.length)return;const dn=I.filter(e=>{const r=rec(dt,e.key);return r&&(r.st==='taken'||r.st==='skipped')}).length,done=dn===I.length,k=dt+s,open=OPEN[k]!==undefined?OPEN[k]:!done;

if(open)h+=`<div class="grp">${I.map(e=>rowT(e,dt,now)).join('')}</div>${done?'':`<button class="btn o" onclick="grp('${s}')">Mark group taken</button>`}`;
h+='</section>'})}
return h+shelves()}

function tgl(s,open){OPEN[today()+s]=!open;render()}
function warn(){const W2=[],by={};S.plan.forEach(p=>p.doses.forEach(s=>(by[s]=by[s]||[]).push(p)));
const gf=p=>p.i>=0?D[p.i].g:'';
for(const t in by){const z=by[t].filter(x=>gf(x).includes('z'));if(z.length>1)W2.push(z.map(lk).join(' + ')+' compete for absorption. Space them 2+ hours apart.')}
S.plan.forEach(x=>{if(gf(x).includes('e')&&x.doses.some(s=>s==='s'||s==='d'))W2.push(lk(x)+' can be stimulating. Move it earlier.')});
const has=r=>S.plan.some(x=>r.test(x.n)),z=S.plan.find(x=>x.n==='Zinc');if(z&&z.unit==='mg'&&+z.dose>=40)W2.push('Your saved zinc dose is 40 mg or more. Long-term high-dose zinc can lower copper. Check the zinc in all your products and ask a clinician about copper testing.');
const b6=S.plan.filter(x=>x.n==='Vitamin B6'&&x.unit==='mg').reduce((a,x)=>a+(+x.dose||0)*x.doses.length,0);if(b6>12)W2.push('Your saved vitamin B6 totals more than 12 mg a day, the European upper limit. Neuropathy cases have been reported at lower doses than the U.S. limit. Add up B6 from every product.');
if(new Set(S.plan.filter(x=>/^Magnesium/.test(x.n)).map(x=>x.n)).size>1)W2.push('Several magnesium forms: keep total supplemental elemental magnesium near 400 mg.');return W2}

<details class="pl" ${act.length?'open':''}><summary>Problem plans${act.length?' ('+act.length+' active)':''}</summary>${act.map(a=>`<button class="it grp" style="width:100%;margin-top:8px" onclick="openPlanSheet(${PK.indexOf(a)})">${pic(a,'sm')}<span class="tx"><span class="nm">${esc(a)}</span><span class="ds">${S.plan.filter(x=>x.pl===a).length} in your plan</span></span>${ic('chev')}</button>`).join('')}<div class="tiles">${PK.map((p,i)=>vis(p)?`<button class="tile" onclick="openPlanSheet(${i})">${pic(p,'sm')}<span>${p}</span></button>`:'').join('')}</div></details><div id="el"></div>`}
function fillExp(){const q=EQ.toLowerCase().trim(),ph=q?PK.filter(p=>vis(p)&&p.toLowerCase().includes(q)):[];
const L=D.filter(d=>{if(EC&&d.c!==EC)return false;if(EG==='_50'){if(!o50()[d.n])return false}else if(EG&&!P[EG].s.has(d.i))return false;
if(!q)return true;return (d.n+' '+d.f+' '+d.o+' '+d.c+' '+(INFO[d.n]||'')+' '+idx(d.n)).toLowerCase().includes(q)||(PM[d.n]||[]).some(p=>p.toLowerCase().includes(q))});
let h='';if(ph.length)h+=`<div class="sec"><h3>Problems matching "${esc(EQ)}"</h3></div><div class="grp">${ph.map(p=>`<button class="it" style="width:100%" onclick="openPlanSheet(${PK.indexOf(p)})">${pic(p,'sm')}<span class="tx"><span class="nm">${p}</span><span class="ds">${P[p].s.size} supplements. Tap to review a plan.</span></span>${ic('chev')}</button>`).join('')}</div>`;
if(EG==='_50')h+=`<div class="bn">${O50NOTE}</div>`;if(EG&&P[EG])h+=`<div class="box"><b>${EG}</b>${esc((TP[EG]||{}).mean||'')}<button class="btn o" onclick="openPlanSheet(${PK.indexOf(EG)})">Open the topic page</button></div>`;

function dayRows(date){const m={};expected(date).forEach(e=>{m[e.key]={key:e.key,n:e.p.n,ds:sumTxt(e.p),sl:e.sl,r:null}});
const L=S.log[date]||{};for(const key in L){const r=L[key];if(!m[key])m[key]={key,n:r.n,ds:r.ds,sl:r.sl};m[key].r=r;m[key].n=r.n||m[key].n;if(r.ds!==undefined&&r.ds!==null)m[key].ds=r.ds}
return Object.values(m).sort((a,b)=>SK.indexOf(a.sl)-SK.indexOf(b.sl)||String(a.n).localeCompare(String(b.n)))}
function stOf(x,date){const r=x.r;if(r&&r.st==='taken')return 'taken';if(r&&r.st==='skipped')return 'skipped';const t=today();return date<t?'unrec':date===t?'pend':'future'}
function cnt(date){const rows=dayRows(date),c={n:rows.length,taken:0,skipped:0,unrec:0};rows.forEach(x=>{const s=stOf(x,date);if(c[s]!==undefined)c[s]++});return c}

const T=C.reduce((a,c)=>({taken:a.taken+c.taken,skipped:a.skipped+c.skipped,unrec:a.unrec+c.unrec,n:a.n+(days[C.indexOf(c)]<=t?c.n:0)}),{taken:0,skipped:0,unrec:0,n:0});
const rows=dayRows(HS),lbl=pdt(HS).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
let h=hdr('','History')+`<div class="grp" style="padding:14px 16px"><b>This week</b><div class="mut">${pdt(days[0]).toLocaleDateString(undefined,{month:'short',day:'numeric'})} to ${pdt(days[6]).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div><div style="margin-top:6px;font-size:15px"><b style="color:var(--ok)">${T.taken} taken</b>, <b style="color:var(--wn)">${T.skipped} skipped</b>, <span class="mut">${T.unrec} not recorded</span></div></div>
<div class="two" style="margin-top:12px"><button class="btn o" style="margin:0" onclick="HS=addD(HS,-7);render()">Previous week</button><button class="btn o" style="margin:0" ${ws>=addD(t,-wd(t))?'disabled':''} onclick="HS=addD(HS,7);if(HS>today())HS=today();render()">Next week</button></div>
<div class="bars" role="group" aria-label="Pick a day">${days.map((d,i)=>{const c=C[i],fut=d>t,hh=v=>(c.n?v/mx*100:0)+'%';return `<button class="bc" aria-pressed="${d===HS}" ${fut?'':''} aria-label="${DNM[i]} ${pdt(d).getDate()}: ${c.taken} taken, ${c.skipped} skipped, ${fut?0:c.unrec} not recorded" onclick="HS='${d}';render()"><small>${DAYS[i]}</small><span class="st"><i class="ok" style="height:${hh(c.taken)}"></i><i class="wn" style="height:${hh(c.skipped)}"></i></span><small>${pdt(d).getDate()}</small></button>`}).join('')}</div>
<div class="leg"><span><i style="background:var(--ok)"></i>Taken</span><span><i style="background:var(--wn)"></i>Skipped</span><span><i style="background:var(--ln)"></i>Not recorded</span></div>

<div class="sec"><h3>${lbl}${HS===t?' (today)':''}</h3></div>`;
if(!rows.length)return h+'<p class="mut">Nothing was scheduled or recorded on this day.</p>';

function hideSheet(){SH=null;$('shade').classList.remove('on');$('sheet').classList.remove('on');$('view').removeAttribute('aria-hidden');$('tabs').removeAttribute('aria-hidden');$('view').inert=false;$('tabs').inert=false}

parseB(`=Vitamin B12
s1: The form (cyanocobalamin, methylcobalamin, hydroxocobalamin or adenosylcobalamin), mcg per serving, and how many capsules make a serving.
s2: Fatigue has many causes. A blood level, not a symptom, shows whether you are low.
s3: Treating a real deficiency: established. More energy or better mood when levels are normal: not established.
s4: Numbness, balance trouble or memory change need a clinician, not a supplement trial.
what: A vitamin your nerves, red blood cells and DNA need. It comes mainly from animal foods. Absorption falls with age, with metformin or acid-reducing drugs, after stomach or bowel surgery, and in pernicious anemia.
use: Treating or preventing B12 deficiency|Established|Oral high doses and injections both raised blood levels in trials of people with deficiency.
use: Fatigue or low energy when B12 is normal|None established|No reliable evidence of benefit.
use: Memory or mood|Unclear|Any benefit is mainly where deficiency is present.
who: People who eat little or no animal food, older adults, people on metformin or long-term acid reducers, people with gut surgery or malabsorption.
not: People with normal B12 status. Extra B12 does not boost energy on its own.
form: Cyanocobalamin|Synthetic, stable and cheap. Used in most studies and in many U.S. injections. The body converts it to the active forms.
form: Methylcobalamin|A coenzyme (active) form that occurs in food. Not shown to correct deficiency better than cyanocobalamin.
form: Adenosylcobalamin|The other coenzyme (active) form. Often sold in blends. Little head-to-head evidence.
form: Hydroxocobalamin|A natural form and a precursor that the body converts. Common for injections in the UK and Europe. Releases slowly.
form: Natural vs synthetic|Methylcobalamin, adenosylcobalamin and hydroxocobalamin occur naturally. Cyanocobalamin is made during lab purification.
form: Tablet, sublingual or injection|A 2018 Cochrane review (low-quality evidence) found oral 1,000 mcg/day similar to injections for normalizing blood levels. Injections are chosen when absorption is impaired or deficiency is severe. No route is best for everyone.
fav: Gary Brecka, who describes himself as a human biologist, advises avoiding cyanocobalamin and favors methylated forms and hydroxocobalamin (Ultimate Human podcast episode 31, Jan 2024). His podcast discloses that he or his company may hold economic interests in products it promotes. See the Experts section for his profile.
avoid: Doses of 5,000 mcg or more add little if you are not deficient. Check the form and the mcg per serving on the label.
label: Read the exact form and the mcg per serving. "Methylated" or "active" on the front says nothing about the dose. Check the serving size.
req: About 2.4 mcg a day for adults (U.S. RDA). Only a small fraction of a high oral dose is absorbed, which is why trials use 1,000 mcg or more.
studied: 1,000 to 2,000 mcg a day by mouth in deficiency trials (Cochrane 2018).
ul: No upper limit has been set in the U.S.
time: Any time, with or without food.
ess: Preference only.
onset: Blood levels usually rise within weeks. Symptoms can take months and may not fully reverse.
reassess: Recheck the blood level after a couple of months, or as your clinician advises.
side: Usually none. Rarely acne, rash, or injection-site pain.
inter: Metformin, proton pump inhibitors and H2 blockers can lower B12 absorption. Chloramphenicol can blunt the response.
caut: Leber's hereditary optic neuropathy and kidney disease: ask a clinician which form is suitable.
labs: Serum B12. When it is borderline, methylmalonic acid (MMA) and homocysteine can help. A clinician should interpret them.
stop: Numbness or tingling, trouble walking, confusion, memory loss, a sore tongue, or tiredness with pale skin: see a clinician.
food: Meat, fish, shellfish, eggs, dairy, fortified cereals, nutritional yeast.
qual: Check the form and mcg on the label. Look for a seal on the specific product, not only the brand.
src: brecka31,cochraneB12,afpB12
rel: Folate;Vitamin B6;B-complex;Multivitamin;Methylated multivitamin;Sublingual and dissolving products;Liposomal supplements
=Magnesium glycinate;Magnesium citrate;Magnesium L-threonate;Magnesium malate;Magnesium taurate;Magnesium oxide;Magnesium topical
s1: Elemental magnesium in mg per serving (not the compound weight), the form, and how many capsules make a serving.
s2: Labels that say "glycinate" but also list oxide. "Buffered" is a clue to read the full label.
s3: Constipation (citrate, oxide) is well supported. Sleep, anxiety, cramps, migraine and blood pressure have limited or mixed human evidence.
s4: Kidney disease raises the risk of magnesium build-up. Ask a clinician first. Magnesium can block some medicines.
what: An essential mineral involved in muscle, nerve and energy chemistry. The NIH fact sheet notes that symptomatic deficiency from low food intake is uncommon in otherwise-healthy people because the kidneys limit losses, and that older adults tend to eat less magnesium. Supplements bind it to different partners (glycine, citrate and others) that change how it behaves in the gut.
use: Constipation (citrate, oxide)|Established|Magnesium salts draw water into the bowel.

basic: Gradual increases in load, sleep, enough protein, hydration, gentle movement, heat.
strong: Creatine helps strength with training (not soreness itself).
cond: Tart cherry and curcumin: small trials, limited evidence for soreness. Topical arnica: mixed small trials.
neg: BCAAs or EAAs when protein is already adequate. Magnesium for soreness without a deficiency: no clear evidence.
redund: Several anti-inflammatory herbs at once.
test: Pain lasting more than a few weeks, weakness, or new symptoms on a statin.
warn: Dark or cola-colored urine, severe swelling, marked weakness, fever: urgent care.
links: Creatine;Tart cherry;Turmeric / curcumin;Arnica;Collagen;Magnesium malate;Bromelain
=Muscle cramps
mean: A sudden painful muscle contraction. Do not assume cramps mean low magnesium.
cause: Exertion and fatigue, heat and sweat loss, some medicines (diuretics, statins), nerve or circulation conditions, and often no clear cause.
basic: Stretching, gradual conditioning, hydration, and replacing sodium during heavy sweating.
strong: None.
cond: Electrolyte drinks during heavy sweating: limited evidence.
neg: Magnesium for night cramps in older adults: a Cochrane review found it unlikely to give meaningful relief (not source-verified here). Potassium pills can be unsafe.
redund: Magnesium plus potassium plus electrolyte mixes.
test: Frequent cramps, or cramps with swelling, weakness or skin changes: electrolytes and kidney function through a clinician.
warn: Muscle weakness, leg swelling or redness: seek care.
links: Magnesium glycinate;Magnesium citrate;Electrolytes;Potassium
=Joint pain
mean: Joint pain can come from osteoarthritis, inflammatory arthritis, gout or injury.
cause: Wear and overload, inflammation, uric acid crystals, injury.
basic: Movement and strength training, weight management, heat or cold, and clinician review for swelling or morning stiffness.
strong: None of the supplements has strong evidence.
cond: Curcumin for knee osteoarthritis pain: limited, formulation-specific. Glucosamine and chondroitin: mixed trials. Collagen, boswellia, MSM, oral hyaluronic acid: limited.
neg: Glucosamine hydrochloride products with low doses. Omega-3 for osteoarthritis: limited.
redund: Combining glucosamine, chondroitin, MSM, collagen and curcumin at once.
test: Swelling, warmth, morning stiffness over about an hour, fever, or multiple small joints.
warn: A hot swollen joint with fever, inability to bear weight, or sudden severe pain: urgent care.
links: Turmeric / curcumin;Glucosamine;Chondroitin;MSM;Boswellia;Collagen;Fish oil;Hyaluronic acid
=Inflammation
mean: "Inflammation" is not one condition. Blood markers like CRP are not specific.
cause: Infections, autoimmune conditions, obesity, smoking, sleep loss, injury.
basic: Treat the underlying cause. Sleep, activity, a balanced diet and smoking cessation help.
strong: None as a general "anti-inflammatory."
cond: Omega-3 lowers triglycerides. Curcumin for osteoarthritis: limited.
neg: General "anti-inflammatory stacks": not established.
redund: Fish oil plus turmeric plus boswellia plus ginger.
test: Only when a clinician sees a reason (for example CRP with symptoms).
warn: Fever, unexplained weight loss, joint swelling, rashes.
links: Fish oil;Turmeric / curcumin;Boswellia;Ginger;Astaxanthin;Resveratrol;Quercetin
=Poor sleep
mean: Trouble falling or staying asleep. Persistent insomnia has many causes.
cause: Stress, caffeine and alcohol, an irregular schedule, sleep apnea, restless legs, nighttime urination, pain, medicines, depression.
basic: Consistent sleep and wake times, morning light, no caffeine late, limiting alcohol, a cool dark room, and cognitive behavioral therapy for insomnia (the best-supported approach).
strong: No supplement is as well supported as CBT-I. Melatonin has moderate evidence for circadian timing problems.
cond: Glycine, ashwagandha, L-theanine, magnesium, tart cherry: small or limited trials.
neg: GABA, valerian, passionflower and kava: inconsistent or limited evidence. Kava carries liver concerns.
redund: Several sedating products at once (melatonin plus valerian plus kava).
test: Loud snoring, gasping or daytime sleepiness suggest sleep apnea: ask about a sleep study.
warn: Insomnia lasting more than about three months, low mood, or dangerous drowsiness while driving.
links: Melatonin;Magnesium glycinate;Glycine;L-theanine;Ashwagandha;Apigenin;Tart cherry;Lemon balm;Valerian;Passionflower
=Stress / anxiety
mean: Stress is a response to pressure. Anxiety disorders are conditions that deserve evaluation.
cause: Life stress, sleep loss, caffeine, medical conditions, medicines.
basic: Regular exercise, sleep, therapy (such as CBT), breathing practices, less caffeine and alcohol.
strong: None among supplements.
cond: Ashwagandha, L-theanine, lemon balm, magnesium, rhodiola: limited trials. Kava: modest short-term benefit, with liver concerns.
neg: 5-HTP and GABA: limited, and 5-HTP can interact dangerously with antidepressants.
redund: Combining several sedating herbs.
test: Thyroid, anemia and B12 checks by a clinician if symptoms suggest them.
warn: Panic attacks, symptoms that disrupt life for more than two weeks, or thoughts of self-harm: seek help right away.
links: Ashwagandha;L-theanine;Magnesium glycinate;Rhodiola;Holy basil;Lemon balm;Kava;5-HTP
=Low energy
mean: Tiredness has many causes. Supplements help when they correct a proven deficiency.
cause: Poor sleep, sleep apnea, depression, thyroid problems, anemia, diabetes, low B12 or vitamin D, medicines, alcohol.
basic: Sleep, activity, regular meals, and a medical review for ongoing fatigue.
strong: Correcting a documented deficiency (iron, B12, vitamin D) is established.
cond: Creatine: limited for fatigue.
neg: Stimulant stacks, iron without testing, and B12 injections when levels are normal.
redund: Combining several stimulants (caffeine, rhodiola, ginseng, tyrosine).
test: Blood count, ferritin, B12, thyroid, glucose, and sleep apnea screening, as advised by a clinician.
warn: Unexplained weight loss, fever, chest pain, shortness of breath, black stools.
links: Vitamin B12;Vitamin D3;Iron;Creatine;Rhodiola;Panax ginseng;Cordyceps;Caffeine
=Brain fog
mean: A feeling of poor focus or memory. It is not a diagnosis.
cause: Poor sleep, stress, depression, medicines, thyroid problems, B12 deficiency, alcohol, long-term illness.
basic: Sleep, exercise, treating contributors, and a medication review.
strong: Correcting a B12 deficiency, if present.
cond: Bacopa, lion's mane, phosphatidylserine, creatine: small trials. Limited.
neg: Ginkgo for dementia prevention: a large trial found no benefit. "Nootropic stacks": not established.
redund: Several memory supplements at once.
test: B12, thyroid, depression screening, sleep apnea as indicated.
warn: Memory loss with confusion, sudden onset, personality change, stroke symptoms, or after a head injury.
links: Vitamin B12;Creatine;Bacopa;Lion's mane;Phosphatidylserine;Choline;L-theanine;Fish oil;Ginkgo
=Bloating / digestion
mean: Digestive symptoms have many different causes.
cause: Lactose intolerance, IBS, constipation, reflux, celiac disease, medicines, SIBO and others.
basic: A food and symptom diary, gradual fiber increases, hydration, and screening as recommended. The U.S. Preventive Services Task Force recommends colorectal cancer screening for adults 45 to 75 at average risk.
strong: Lactase for lactose intolerance. Psyllium for constipation and cholesterol.
cond: Enteric-coated peppermint oil for IBS symptoms: moderate. Probiotics: strain-specific.
neg: Betaine HCl and broad enzyme blends: limited evidence. Glutamine and butyrate: limited.
redund: Multiple probiotics, enzymes and fibers together.
test: Persistent symptoms beyond a few weeks, new symptoms at 45 or older, anemia, weight loss, or blood in stool.
warn: Black or bloody stools, vomiting blood, severe pain, trouble swallowing, unexplained weight loss.
links: Psyllium husk;Peppermint oil;Probiotic;Prebiotic fiber;Digestive enzymes;Betaine HCl;Ginger;Magnesium citrate

=Prostate / urination
mean: Urinary changes in men over 50 are common and have several causes, including an enlarged prostate.
cause: Benign prostatic enlargement, infection, overactive bladder, diabetes, medicines, sleep apnea.
basic: Evaluation by a clinician, less fluid and caffeine late in the day, and treating sleep apnea when it contributes.
strong: None among supplements.
cond: Pumpkin seed oil and nettle root: very limited.
neg: Saw palmetto: Cochrane reviews found no clear benefit for urinary symptoms. Lycopene, zinc, selenium: not established.
redund: Saw palmetto plus nettle plus pumpkin seed oil.
test: Discuss prostate cancer screening and urinary symptoms with a clinician.
warn: Blood in urine, inability to urinate, fever with urinary symptoms, severe back pain.
links: Saw palmetto;Pumpkin seed oil;Nettle root;Lycopene;Zinc;Selenium
=Low drive / hormones
mean: Low libido is not the same as confirmed testosterone deficiency.
cause: Stress, depression, poor sleep, sleep apnea, obesity, alcohol, medicines (including antidepressants and opioids), diabetes, relationship factors.
basic: Sleep, resistance exercise, alcohol limits, weight, and a review of medicines.
strong: None among supplements. Diagnosing deficiency needs symptoms plus repeated morning testosterone tests.
cond: Ashwagandha, tongkat ali, fenugreek, maca: small trials. Limited.
neg: "Testosterone boosters": not established. Zinc or vitamin D only help if you are deficient.
redund: Multiple "booster" products.
test: Morning total testosterone twice, with thyroid and other tests per your clinician. Erectile problems can be an early sign of heart disease, so discuss them.
warn: Chest pain with exertion, sudden loss of function, breast changes, vision changes.
links: Ashwagandha;Tongkat ali;Zinc;Vitamin D3;Maca;Fenugreek;Boron
=Blood pressure
mean: High blood pressure is diagnosed by repeated measurements.
cause: Sodium intake, weight, alcohol, sleep apnea, inactivity, kidney disease, medicines, genetics.
basic: A validated home cuff, less sodium, DASH-style eating, potassium from food, exercise, alcohol limits.
strong: None among supplements replaces medicine.
cond: Magnesium, beetroot nitrate, aged garlic, fish oil, CoQ10: small reductions in some trials.
neg: Potassium pills and salt substitutes can be dangerous with kidney disease or certain medicines.
redund: Several blood pressure supplements together with prescription drugs.
test: Home readings and clinician follow-up.
warn: Readings of 180 over 120 or more with symptoms, chest pain, vision change, or severe headache: urgent care.
links: Magnesium taurate;Potassium;Fish oil;Aged garlic;Beetroot nitrate;CoQ10;Taurine
=Blood sugar
mean: Prediabetes and diabetes are diagnosed by lab tests.
cause: Genetics, weight, inactivity, diet, sleep.
basic: Activity, diet pattern, weight, sleep, and clinician-directed tests (HbA1c, fasting glucose).
strong: None among supplements replaces medicine.
cond: Berberine: small to moderate trials. Cinnamon, chromium, alpha-lipoic acid, magnesium: mixed or limited.
neg: "Natural metformin" claims. Do not stop prescribed medicine.
redund: Several glucose-lowering supplements, which can cause low blood sugar with medicines.
test: HbA1c or fasting glucose through a clinician.
warn: Extreme thirst or urination, blurred vision, foot sores, or symptoms of low blood sugar.
links: Berberine;Ceylon cinnamon;Chromium;Alpha-lipoic acid;Magnesium citrate;Fenugreek;Benfotiamine (B1)
=Heart / cholesterol
mean: Triglycerides, LDL cholesterol and heart-attack risk are related but different.
cause: Genetics, diet, inactivity, weight, smoking, blood pressure and diabetes.
basic: Diet, activity, weight, no smoking, blood pressure control, and a statin discussion when indicated.
strong: Higher-dose omega-3 lowers triglycerides. Psyllium lowers LDL modestly.
cond: Over-the-counter fish oil for preventing heart attacks: mixed. Prescription icosapent ethyl reduced events in one trial, which does not apply to ordinary fish oil.
neg: Added niacin on top of statins did not reduce events and had side effects. CoQ10 for statin muscle symptoms: mixed.
redund: Several cholesterol supplements without a lab-based reason.
test: A lipid panel. Ask your clinician whether additional tests (such as ApoB or lipoprotein(a)) make sense.
warn: Chest pain, shortness of breath, fainting, sudden weakness: call for urgent care.
links: Fish oil;Psyllium husk;Niacin (B3);CoQ10;Aged garlic;Taurine;Magnesium taurate
=Immune / colds
mean: Colds are common viral infections.
cause: Viruses, close contact, sleep loss.
basic: Sleep, vaccines, hand washing, and activity.
strong: None prevents colds in general.
cond: Zinc lozenges at the start of a cold: limited and mixed. Regular vitamin C: may shorten colds slightly. Vitamin D mainly helps if you are deficient. Elderberry: small trials.
neg: Megadoses of any single vitamin. Quercetin and NAC: limited.
redund: Combining several "immune" products.
test: Recurrent or severe infections deserve evaluation.
warn: Trouble breathing, chest pain, fever lasting more than a few days, or confusion.
links: Vitamin D3;Vitamin C;Zinc;Elderberry;Quercetin;Probiotic;Selenium;NAC
=Nerve tingling
mean: Tingling or numbness (neuropathy) has several causes.
cause: Diabetes, B12 deficiency, excess vitamin B6, alcohol, carpal or cubital tunnel (repetitive work, vibrating tools), neck or back problems, thyroid disease, some medicines.
basic: Review every supplement label for vitamin B6, since multivitamins, B-complexes, energy drinks and protein bars can add up. Cases of neuropathy have been reported below 50 mg a day, and the European limit is 12 mg a day.
strong: Correcting a documented B12 deficiency. Stopping excess B6.
cond: Benfotiamine, alpha-lipoic acid, acetyl-L-carnitine: limited evidence in diabetic neuropathy.
neg: High-dose B-complex products.
redund: Multiple B6-containing products.
test: B12 (and MMA if borderline), glucose or HbA1c, thyroid, and possibly a B6 level, plus a clinician exam.
warn: Progressive weakness, loss of balance, bladder or bowel changes, or sudden one-sided symptoms.
links: Vitamin B6;Vitamin B12;Benfotiamine (B1);Alpha-lipoic acid;B-complex;Multivitamin
=Eye health
mean: Eye health depends on regular exams. Supplements play a narrow role.
cause: Age-related macular degeneration, cataracts, glaucoma, dry eye, diabetes.
basic: Regular dilated eye exams, UV protection, no smoking, blood pressure and glucose control.
strong: The AREDS2 formula is 500 mg vitamin C, 400 IU vitamin E, 80 mg zinc, 2 mg copper, 10 mg lutein and 2 mg zeaxanthin. The National Eye Institute describes it for people with intermediate macular degeneration, or advanced disease in one eye. It did not help early disease and is not shown to prevent the disease. The zinc and vitamin E amounts are above general upper limits, so it is used only with an eye doctor's guidance.
cond: Lutein and zeaxanthin on their own: limited. Astaxanthin: preliminary.
neg: Omega-3 for macular degeneration or dry eye: no clear benefit in large trials.
redund: "Eye vitamins" on top of a multivitamin (zinc, vitamin A, vitamin E overlap).
test: Dilated eye exam with an eye doctor.
warn: Sudden vision loss, flashes or new floaters, a curtain over vision, distorted straight lines: urgent care.
links: Lutein + zeaxanthin;Astaxanthin;Fish oil;Zinc;Vitamin C;Vitamin E

return card('Creatine monohydrate',`${g1(0.03*kg)} g a day <span class="mut">(maintenance, 0.03 g/kg)</span>`,`A flat 3 to 5 g a day is what most people use, and what many trials used. Optional loading is about ${g(0.3*kg)} g a day for 5 to 7 days (0.3 g/kg), split into four doses. One review cites 0.05 to 0.15 g/kg a day for maintenance, so published numbers vary.`,'Kidney disease: ask a clinician. Creatine can raise creatinine on lab tests. The original position stand was not opened here, so these figures come from secondary summaries.','issnCre')+
card('Protein (food plus supplements)',`${g(1.4*kg)} to ${g(2.0*kg)} g a day <span class="mut">(1.4 to 2.0 g/kg)</span>`,`For exercising adults this range is described as sufficient for most. Per serving, about ${g(0.25*kg)} g (0.25 g/kg) or 20 to 40 g, spread across the day. Food counts toward the total, and whey is one way to reach it.`,'This is a range for people who exercise, not a requirement for everyone. Kidney disease, illness and older age change advice: ask your clinician.','issnProt')+

function wslide(v){const n=parseFloat(v);if(!(n>0))return;S.wset=true;S.wt=R(S.wu==='kg'?n*2.2046:n,2);save();$('wbig').textContent=(S.wu==='kg'?R(S.wt/2.2046,1)+' kg':R(S.wt)+' lb');$('walt').textContent=(S.wu==='kg'?R(S.wt)+' lb':R(S.wt/2.2046,1)+' kg');$('wi2').value=S.wu==='kg'?R(S.wt/2.2046,1):R(S.wt);$('wres').innerHTML=wres()}

`=f50|Often discussed for adults 50+|These come up often after 50. They are not recommendations, and most people do not need all of them. Diet, lab results and your clinician decide.
@Muscle and strength
Creatine|Studied with resistance training for muscle and strength, with moderate evidence in healthy aging muscle.|Moderate
Whey protein|Helps meet protein needs. Total daily protein matters more than the scoop.|Established
@Bone
Vitamin D3|Needs are 600 IU to age 70 and 800 IU after, and depend on sun and labs. A blood test beats guessing.|Established if low
Calcium|Food first. Needs are 1,000 mg for men to 70 and 1,200 mg for women after 50 and for everyone after 70.|Established if low
Vitamin K2|Studied for bones and arteries with mixed results. Not for people on warfarin unless supervised.|Limited
Magnesium glycinate|Older adults tend to eat less magnesium, though deficiency from diet alone is uncommon.|Established if low
@Heart and metabolic
Fish oil|Mainly lowers triglycerides at higher doses. Heart-attack prevention with over-the-counter oil is mixed.|Established for triglycerides
Psyllium husk|Lowers LDL cholesterol modestly and helps constipation.|Moderate
CoQ10|Levels fall with age and with statins. Benefits are limited and clinician-directed.|Limited
Berberine|Small to moderate effects on blood sugar. Many drug interactions, so clinician-supervised.|Limited to moderate
Aged garlic|Small blood pressure and cholesterol effects in trials of aged garlic extract.|Limited
@Brain, nerves and mood
Vitamin B12|Absorption can fall with age and with metformin or acid-reducing medicines. Test before supplementing.|Established if low
Folate|Check B12 before high doses. Helps only if intake is low.|Established if low
Benfotiamine (B1)|Small trials in diabetic nerve symptoms.|Limited
Alpha-lipoic acid|Used for diabetic neuropathy. Evidence is stronger for the intravenous form.|Limited (oral)
Bacopa|Small memory trials over about 12 weeks.|Limited
@Eyes
Lutein + zeaxanthin|Part of the AREDS2 formula for intermediate macular degeneration under an eye doctor. Not general prevention.|Specific use
@Digestion
Probiotic|Strain-specific. Moderate evidence for antibiotic-associated diarrhea.|Moderate (by strain)
Prebiotic fiber|Feeds gut bacteria. Start low to limit gas.|Limited
Magnesium citrate|Loosens stool. Useful for occasional constipation.|Established for constipation
@Sleep and stress
Melatonin|Helps with timing problems such as jet lag. Small effect on general insomnia.|Moderate for timing
Glycine|Small studies for sleep quality.|Limited
Ashwagandha|Short trials of specific extracts for perceived stress. Liver and thyroid cautions.|Limited
L-theanine|Small trials for calm focus.|Limited
@m:Prostate and urinary (men)
Saw palmetto|Cochrane reviews found no clear benefit for urinary symptoms.|Negative overall
Pumpkin seed oil|Very small trials.|Limited
Lycopene|Prostate claims are preliminary.|Preliminary
@m:Libido and hormones (men)

25-OH vitamin D|Before taking vitamin D above the usual amounts.
Vitamin B12 (and MMA if borderline)|If you eat little animal food, take metformin or acid reducers, or have nerve symptoms.
Kidney function (creatinine or eGFR)|Before creatine, magnesium or other higher-dose supplements.

Thyroid (TSH)|If energy, weight or mood change. Relevant to ashwagandha, iodine and biotin lab interference.

Colorectal cancer screening|The U.S. Preventive Services Task Force recommends screening average-risk adults 45 to 75.
m:Prostate screening and urinary symptoms|Talk with a clinician about prostate screening and any urinary changes.
Dilated eye exam|Regular exams matter. AREDS2 only if an eye doctor says so.
Sleep apnea screening|Loud snoring, gasping or daytime sleepiness.
Medicine and supplement review|Ask your pharmacist about interactions.

let IMPR=null,IMPT='';
const TOK={mag:'magnesium',vit:'vitamin',vitamins:'vitamin',probiotics:'probiotic',tumeric:'turmeric',omega3:'omega 3'};
const PHR={'omega 3':'fish oil','omega-3':'fish oil','omega 3 fish oil':'fish oil','vitamin d':'vitamin d3','d3':'vitamin d3','d':'vitamin d3','b12':'vitamin b12','vitamin b 12':'vitamin b12','b6':'vitamin b6','vitamin k':'vitamin k2','k2':'vitamin k2','curcumin':'turmeric / curcumin','turmeric':'turmeric / curcumin','multi':'multivitamin','multi vitamin':'multivitamin','daily multivitamin':'multivitamin','nmn':'nr / nmn','nr':'nr / nmn','coq10':'coq10','co q10':'coq10','coenzyme q10':'coq10','theanine':'l-theanine','l theanine':'l-theanine','ala':'alpha-lipoic acid','alpha lipoic acid':'alpha-lipoic acid','b complex':'b-complex','vitamin b complex':'b-complex','lions mane':"lion's mane",'lion s mane':"lion's mane",'glucosamine chondroitin':'glucosamine','whey':'whey protein','protein powder':'whey protein','folic acid':'folate','methylfolate':'folate','l methylfolate':'folate','niacin':'niacin (b3)','b3':'niacin (b3)','b1':'benfotiamine (b1)','thiamine':'benfotiamine (b1)','b2':'riboflavin (b2)','greens':'greens powder','ag1':'greens powder','electrolyte':'electrolytes','hcl':'betaine hcl','betaine hcl':'betaine hcl'};
const normT=s=>s.toLowerCase().replace(/[()]/g,' ').replace(/[^a-z0-9\/+' -]/g,' ').replace(/\s+/g,' ').trim();
function parseLine(raw){let s=raw.replace(/^[\s\-\*\u2022\d.)]+(?=[A-Za-z])/,'');let dose='',unit='';const m=s.match(/(\d[\d,]*\.?\d*)\s*(mg|mcg|µg|ug|g|iu|ml)\b/i);if(m){dose=m[1].replace(/,/g,'');const u=m[2].toLowerCase();unit=u==='iu'?'IU':(u==='µg'||u==='ug')?'mcg':u;s=s.replace(m[0],' ')}
s=s.replace(/(?<![-\w])\d+\s*(x|times)\s*(a|per)?\s*(day|daily)?\b/gi,' ').replace(/\b(capsules?|caps|tablets?|softgels?|gummies|powder|liquid|supplement|daily|twice|once)\b/gi,' ');return {name:normT(s),dose,unit}}
function candFor(name){if(!name)return [];const nm=PHR[name]||name.split(' ').map(t=>TOK[t]||t).join(' ');const key=PHR[nm]||nm;const out=[];D.forEach((d,i)=>{const dn=d.n.toLowerCase(),dN=normT(d.n);let sc=0;if(dn===key||dN===key)sc=100;else if(dn.startsWith(key+' ')||dN.startsWith(key+' '))sc=70;else if(key.length>=4&&(dN.includes(key)||key.includes(dN)))sc=60;else{const a=new Set(key.split(' ').filter(x=>x.length>1)),b=new Set(dN.split(' ').filter(x=>x.length>1));let o=0;a.forEach(x=>{if(b.has(x))o++});if(o)sc=40*o/Math.max(a.size,b.size)}if(sc>=25)out.push({i,sc})});out.sort((a,b)=>b.sc-a.sc);return out.slice(0,6)}
function openImp(){IMPR=null;openSheet({t:'imp'})}
function impGo(){IMPT=$('impt').value;const lines=IMPT.split(/[\n;]|,(?!\d{3}\b)/).map(x=>x.trim()).filter(Boolean).slice(0,150);if(!lines.length){$('impe').textContent='Type or paste at least one supplement.';return}
IMPR=lines.map(raw=>{const p=parseLine(raw),c=candFor(p.name);const exact=c.length&&c[0].sc>=60&&(c.length===1||c[0].sc>c[1].sc);return {raw,dose:p.dose,unit:p.unit,c,sel:exact?String(c[0].i):(c.length?'ask':'custom')}});showSheet()}
function impSel(k,v){IMPR[k].sel=v}
function shImp(){if(!IMPR)return `<div class="sh2"><h2>Paste a list</h2></div><div class="mut" style="margin-bottom:8px">One supplement per line, or separated by commas. Amounts like "5000 IU" are kept. I do not guess any other doses. I match each line to the library, and you confirm before anything is added.</div><textarea id="impt" style="height:170px" placeholder="Magnesium glycinate 200 mg&#10;Vitamin D3 5000 IU&#10;Fish oil&#10;CoQ10">${esc(IMPT)}</textarea><div class="ferr" id="impe" role="alert"></div><button class="btn" onclick="impGo()">Match my list</button>`;
const n=IMPR.filter(r=>r.sel!=='skip'&&r.sel!=='ask').length;
return `<div class="sh2"><h2>Check the matches</h2></div><div class="mut" style="margin-bottom:10px">Change any row. "Ask" rows need a choice before they are added.</div>${IMPR.map((r,k)=>`<div class="rc" style="margin-bottom:10px"><div style="font-weight:650">${esc(r.raw)}</div><select class="sel" onchange="impSel(${k},this.value);showSheet()" aria-label="Match for ${esc(r.raw)}" style="margin-top:6px">${r.sel==='ask'?'<option value="ask" selected>Pick a match</option>':''}${r.c.map(x=>`<option value="${x.i}" ${r.sel===String(x.i)?'selected':''}>${esc(D[x.i].n)}${inPlan(x.i)?' (already in plan)':''}</option>`).join('')}<option value="custom" ${r.sel==='custom'?'selected':''}>Add as typed: ${esc(r.raw.slice(0,40))}</option><option value="skip" ${r.sel==='skip'?'selected':''}>Skip this one</option></select>${r.dose?`<div class="mut" style="font-size:13px;margin-top:4px">Amount kept: ${esc(r.dose+' '+r.unit)}</div>`:''}</div>`).join('')}<button class="btn" onclick="impAdd()">Add ${n} to ${esc(pName())}'s plan</button><button class="btn o" onclick="IMPR=null;showSheet()">Start over</button>`}
function impAdd(){let n=0,skipped=0;IMPR.forEach(r=>{if(r.sel==='skip'||r.sel==='ask'){if(r.sel==='ask')skipped++;return}
if(r.sel==='custom'){S.plan.push({k:uid(),i:-1,n:r.raw.replace(/\s+/g,' ').slice(0,60),pl:'',doses:['b'],days:[0,1,2,3,4,5,6],dose:r.dose,unit:r.unit,qty:'',form:'',brand:'',food:'',notes:'',inv:null,added:today()});n++;return}
const i=+r.sel;if(inPlan(i))return;const w=r.dose?{dose:r.dose,unit:r.unit}:{dose:'',unit:''};S.plan.push({k:uid(),i,n:D[i].n,pl:'',doses:[ds(i)],days:[0,1,2,3,4,5,6],dose:w.dose,unit:w.unit,qty:'',form:'',brand:'',food:'',notes:'',inv:null,added:today()});n++});
save();IMPR=null;SH=null;closeSheet();render();toast('Added '+n+(skipped?'. '+skipped+' row'+(skipped===1?'':'s')+' still needed a choice and were not added':'')+'. Open each one to set the time and details.')}

/* ---------- refresh and start ---------- */
function tick(){const d=today(),ch=d!==LD;LD=d;if(ch&&tab==='hist')HS=d;if(tab==='today'||ch)render()}
setInterval(tick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});window.addEventListener('focus',tick);window.addEventListener('pageshow',tick);
applyTheme();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
render();showErr();
</script></body></html>
